name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Build Next.js Static Export
        run: npm run build:apk
        env:
          # Inserisco le chiavi pubbliche di Supabase necessarie durante la build
          NEXT_PUBLIC_SUPABASE_URL: "https://egojrjpkohlbblirpvsu.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_dyrO-eWpHAX8oyDqopCwfQ_c0IbSI2p"
          # URL remoto per le API AI/ExerciseDB (da configurare su GitHub Secrets)
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
